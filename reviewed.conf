# What omarchy-on-aurora.sh has been checked against. Reviewed against
# omacom/omarchy c0cd26e (2026-11-15, Omarchy 4.5.0). When Omarchy adds a setup
# step or a package ships a new boot/initramfs file, the script stops until it
# is listed here. See README.md, "When upstream changes".

# Added to Omarchy's generic aarch64 set (omarchy-pkg-defaults aarch64).
# wf-recorder: screen recording on Apple silicon (display and GPU are separate
# DRM devices, gpu-screen-recorder finds nothing), from omarchy-aarch64-apple.
EXTRA_PACKAGES="omarchy wf-recorder"

# Never named. Packages already satisfied (by name or provides) are skipped
# automatically; these are dropped even when missing.
#  omarchy-power-profiles-daemon: conflicts with Aurora's power-profiles-daemon
#    (0.30-1.1, required by aurora-power-budget); Aurora's stays.
DROP_PACKAGES="omarchy-power-profiles-daemon"

# Never installed (pacman.conf IgnorePkg): Omarchy's Mac boot chain and runtime,
# its Aurora firmware copy, and its ANE driver. Aurora provides the boot chain,
# firmware, speaker safety and audio.
IGNORE_PKGS="omarchy-mac omarchy-mac-boot omarchy-aurora-firmware omarchy-ane omarchy-ane-dkms omarchy-mac-ml"

# Never written to disk (pacman.conf NoExtract): omarchy-settings' initramfs
# drop-ins (00-omarchy-hooks replaces HOOKS; thunderbolt_module adds an early
# module) and its Limine config. Exact paths only: a glob over
# etc/mkinitcpio.conf.d/ would also block Aurora's own 90-aurora*.conf.
NOEXTRACT="etc/mkinitcpio.conf.d/00-omarchy-hooks.conf etc/mkinitcpio.conf.d/omarchy_hooks.conf etc/mkinitcpio.conf.d/omarchy_vconsole.conf etc/mkinitcpio.conf.d/omarchy_compression.conf etc/mkinitcpio.conf.d/thunderbolt_module.conf etc/mkinitcpio.conf.d/i2c_hid_of_module.conf etc/limine-entry-tool.d/omarchy-defaults.conf etc/limine-entry-tool.d/omarchy-uki.conf"

# Boot/initramfs/pacman-adjacent files in Omarchy packages that were read and
# are fine here. 90-owe-restart: try-restarts the wallpaper user service after an owe upgrade.
KNOWN_FILES="etc/modprobe.d/omarchy-usb-autosuspend.conf usr/share/libalpm/hooks/00-omarchy-update-guard.hook usr/share/libalpm/hooks/10-omarchy-hyprland-reload-pause.hook usr/share/libalpm/hooks/90-omarchy-hyprland-reload-resume.hook usr/share/libalpm/hooks/05-omarchy-passwordless-revoke.hook
usr/share/libalpm/hooks/90-owe-restart.hook"

# Root setup steps that run (install/<stage>/<name>.sh), in Omarchy's order.
# post-install/localdb: updatedb for locate (in the 4.5.0-3 package).
# config/firewall gets an SSH allow rule for the LAN first.
RUN_STEPS="config/theme-system config/browser-policy config/increase-lockout-limit config/lockscreen-pam
config/ssh-command-path config/ssh-keepalive config/docker config/locale config/language config/enable-services
hardware/network hardware/set-wireless-regdom hardware/bluetooth login/sddm post-install/udev post-install/localdb config/firewall"

# Root steps that never run here, and why:
#  config/snapper            snapper + limine-snapper-sync (Aurora has no Limine)
#  hardware/pacman           pacman.conf extras for T2 Macs
#  hardware/platform-setup   Omarchy's Mac boot setup (needs omarchy-mac-boot)
#  hardware/vulkan           would add vulkan-asahi (conflicts with vulkan-aurora)
#  hardware/speaker-tuning   laptop speaker DSP (Aurora owns audio)
#  post-install/pacman       REWRITES /etc/pacman.conf for aarch64-apple, dropping [aurora]
#  hardware/fix-fkeys, hardware/apple/*   Apple paths that are no-ops or Intel/T2 only
#  hardware/nvidia-apps      NVIDIA DGX Spark apps (in the omarchy 4.5.0-3 package, not yet on git HEAD)
#  everything else under hardware/        other vendors' machines
SKIP_STEPS="config/snapper hardware/nvidia-apps hardware/pacman hardware/platform-setup hardware/vulkan hardware/speaker-tuning post-install/pacman
hardware/fix-fkeys hardware/apple/fix-spi-keyboard hardware/apple/fix-suspend-nvme hardware/apple/fix-t2 hardware/apple/fix-brcmfmac-supplicant
hardware/asus-rog hardware/framework16 hardware/dell-xps-touchpad-haptics hardware/surface hardware/gb10/sleep hardware/gb10/cpuidle
hardware/nvidia/dgx-spark-boot hardware/fix-ath12k-board-data hardware/fix-synaptic-touchpad hardware/n1x hardware/nvidia
hardware/intel/video-acceleration hardware/intel/lpmd hardware/intel/thermald hardware/intel/ipu7-camera hardware/intel/fred
hardware/intel/fix-wifi7-eht hardware/intel/sof-firmware hardware/dell-xps13-ptl-speaker-firmware hardware/fix-elgato-camlink-4k
hardware/dell-xps13-sidecar-amps hardware/asus/fix-asus-ptl-display-backlight hardware/asus/fix-asus-ptl-b9406-display
hardware/asus/fix-asus-ptl-b9406-touchpad hardware/asus/fix-z13-touchpad hardware/asus/fix-asus-proart-p14-speakers
hardware/asus/fix-asus-zenbook-a16-speakers hardware/asus/fix-asus-zenbook-14-ux3480qa-audio hardware/asus/fix-asus-proart-pz13-speakers
hardware/acer/fix-acer-aspire-16-ai-speakers hardware/acer/fix-acer-aspire-16-ai-boot hardware/hp/fix-hp-omnibook-3-speakers
hardware/asus/fix-asus-zenbook-a16-boot hardware/asus/fix-asus-zenbook-14-ux3480qa-boot hardware/asus/fix-asus-vivobook-s15-boot
hardware/asus/fix-asus-vivobook-s16-boot hardware/hp/fix-hp-omnibook-x14-boot hardware/fix-n1x-gpu-memory hardware/framework/qmk-hid
hardware/qualcomm/dtb-uki hardware/qualcomm/kernel-params hardware/qualcomm/initramfs hardware/qualcomm/glymur-display
hardware/asus/fix-asus-zenbook-a16-firmware hardware/qualcomm/oem-firmware hardware/qualcomm/firmware hardware/qualcomm/camera
hardware/qualcomm/reboot-watchdog hardware/qualcomm/powerprofiles-floor hardware/lenovo/fix-yoga-pro7-bass-speakers
hardware/lenovo/yoga-slim7x hardware/lenovo/thinkpad-t14s-camera hardware/microsoft/surface-pro-11 hardware/microsoft/surface-laptop8
hardware/fix-bcm43xx hardware/fix-surface-keyboard hardware/fix-yt6801-ethernet-adapter hardware/fix-tuxedo-backlight"

# User steps (run by omarchy-provision-user, as the user). user/platform-setup
# dispatches setup-user, a no-op without omarchy-mac; the hardware ones are
# gated to other machines.
USER_STEPS="user/theme user/chromium user/xcompose user/language user/input-method user/mise-work
user/hardware/asus/fix-audio-mixer user/hardware/asus/fix-mic user/hardware/framework/fix-f13-amd-audio-input
user/hardware/dell/xps13-text-scaling user/hardware/qualcomm/video-decode user/hardware/qualcomm/camera
user/hardware/fix-nouveau-cursor user/hardware/vm-no-animations user/default-keyring user/mise user/platform-setup"

# Files the post-install initramfs may gain (mkinitcpio runs during the package
# transaction). Reviewed 2026-11-15: usbcore autosuspend=-1 (omarchy-settings),
# libqrencode (optional for systemd), NVIDIA options for gpu-screen-recorder,
# SuccessExitStatus=1 for systemd-tpm2-setup-early (omarchy-settings; no TPM on
# a Mac), SystemCallFilter=bpf for udevd (v4l-utils). Anything removed, or added
# and not listed here, stops the initramfs phase.
INITRAMFS_ACCEPT="etc/modprobe.d/omarchy-usb-autosuspend.conf usr/lib/libqrencode.so usr/lib/libqrencode.so.4
usr/lib/libqrencode.so.4.1.1 usr/lib/modprobe.d/gsr-nvidia.conf
usr/lib/systemd/system/systemd-tpm2-setup-early.service.d/ usr/lib/systemd/system/systemd-tpm2-setup-early.service.d/10-omarchy-nvpcr.conf
usr/lib/systemd/system/systemd-udevd.service.d/ usr/lib/systemd/system/systemd-udevd.service.d/50-rc_keymap.conf"
